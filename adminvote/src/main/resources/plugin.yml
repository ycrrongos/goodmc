name: AdminVote
version: '${version}'
main: com.adminvote.AdminVotePlugin
api-version: '1.21'
description: 管理员指令投票与静默传送
author: 爱玩电脑的小融融 (ycrrongos)

commands:
  adminvote:
    description: 回应管理员指令投票
    usage: /adminvote <yes|no> <管理员>
  tph:
    description: 静默传送玩家（仅管理员）
    usage: /tph <玩家> [目标玩家]

permissions:
  goodmc.bypass:
    description: 跳过管理员指令投票
    default: false
  goodmc.tph:
    description: 使用静默传送指令
    default: op
